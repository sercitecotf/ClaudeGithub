<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Reja de hierro forjado a medida con chispas de soldadura">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ff6a1a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ecef"/><stop offset="1" stop-color="#7d8995"/>
    </linearGradient>
  </defs>
  <circle cx="358" cy="190" r="190" fill="url(#glow)"/>
  <!-- marco -->
  <rect x="70" y="80" width="360" height="400" rx="10" fill="none" stroke="url(#steel)" stroke-width="14"/>
  <rect x="92" y="102" width="316" height="356" rx="4" fill="#0e1216" fill-opacity=".55" stroke="#3a444e" stroke-width="2"/>
  <!-- barrotes -->
  <g stroke="url(#steel)" stroke-width="8" stroke-linecap="round">
    <path d="M142 108v344M196 108v344M250 108v344M304 108v344M358 108v344"/>
  </g>
  <!-- travesaños -->
  <g stroke="url(#steel)" stroke-width="10" stroke-linecap="round">
    <path d="M96 190h308M96 372h308"/>
  </g>
  <!-- adorno central -->
  <g fill="none" stroke="#ff8a47" stroke-width="7" stroke-linecap="round">
    <circle cx="250" cy="281" r="46"/>
    <path d="M250 235v92M204 281h92"/>
    <path d="M217 248l66 66M283 248l-66 66" stroke-width="4" stroke="#ffb703"/>
  </g>
  <!-- remaches -->
  <g fill="#ffb703">
    <circle cx="142" cy="190" r="6"/><circle cx="196" cy="190" r="6"/><circle cx="250" cy="190" r="6"/><circle cx="304" cy="190" r="6"/><circle cx="358" cy="190" r="6"/>
    <circle cx="142" cy="372" r="6"/><circle cx="196" cy="372" r="6"/><circle cx="250" cy="372" r="6"/><circle cx="304" cy="372" r="6"/><circle cx="358" cy="372" r="6"/>
  </g>
  <!-- chispas de soldadura -->
  <g stroke="#ffd166" stroke-linecap="round">
    <path d="M358 190l46-52M358 190l62-12M358 190l34 56M358 190l-20-58" stroke-width="4"/>
    <path d="M358 190l78 26M358 190l6-70" stroke-width="2.5"/>
  </g>
  <circle cx="358" cy="190" r="13" fill="#fff4d6"/>
  <circle cx="358" cy="190" r="22" fill="#ffb703" fill-opacity=".35"/>
