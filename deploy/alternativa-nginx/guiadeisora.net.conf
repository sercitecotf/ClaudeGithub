# Sitio estático: guiadeisora.net
server {
    listen 80;
    listen [::]:80;
    server_name guiadeisora.net www.guiadeisora.net;

    root /var/www/guiadeisora.net;
    index index.html;

    # Redirige www al dominio sin www
    if ($host = www.guiadeisora.net) {
        return 301 http://guiadeisora.net$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
