<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Qualitus Next{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; }
        header { background: #f5f7fa; border-bottom: 1px solid #d9dfe4; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #1f6feb; text-decoration: none; font-weight: 600; }
        main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border-bottom: 1px solid #e5e9ec; padding: 0.5rem 0.75rem; text-align: left; }
        th { color: #52606d; text-transform: uppercase; font-size: 0.75rem; }
        .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 0.75rem; font-size: 0.75rem; }
        .badge-yes { background: #d9f2e6; color: #0f7a4f; }
        .badge-no { background: #eceff1; color: #52606d; }
        .search-form { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .search-form input[type="text"] { flex: 1; padding: 0.5rem; border: 1px solid #cbd2d9; border-radius: 0.25rem; }
        .search-form button { padding: 0.5rem 1rem; }
        .pagination { margin-top: 1rem; display: flex; gap: 0.5rem; }
    </style>
</head>
<body>
<header>
    <a href="{% url 'control_points:list' %}">Qualitus Next</a>
    {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Cerrar sesión ({{ user }})</button>
        </form>
    {% endif %}
</header>
<main>
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
